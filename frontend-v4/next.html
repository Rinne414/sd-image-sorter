<!doctype html>
<html lang="zh-CN" data-theme="dark" data-ui="next">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <title>SD 图片管理器 · 新界面试用</title>
    <script>
      // The new interface (docs/DESIGN.md §redesign-2026-10) opens on the
      // library unless the address names another page.
      ;(function () {
        var hash = location.hash
        if (!hash || hash === '#' || hash === '#/' || hash.indexOf('#/home') === 0) {
          history.replaceState(history.state, '', location.pathname + location.search + '#/library')
        }
      })()
    </script>
    <script>
      // Interface zoom before first paint (same rule as src/lib/uiScale.ts): a
      // stored choice from sd-v4-ui-scale, else by window width.
      ;(function () {
        var raw = null
        try {
          raw = localStorage.getItem('sd-v4-ui-scale')
        } catch (e) {}
        var n = Number(raw)
        var w = window.innerWidth
        var scale = raw && [1, 1.15, 1.3, 1.4, 1.5].indexOf(n) >= 0 ? n : w >= 3600 ? 1.5 : w >= 3100 ? 1.4 : w >= 2350 ? 1.3 : w >= 2000 ? 1.15 : 1
        var root = document.documentElement
        root.style.setProperty('--ui-zoom', String(scale))
        if (scale !== 1) root.style.zoom = String(scale)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/next/main.tsx"></script>
  </body>
</html>
